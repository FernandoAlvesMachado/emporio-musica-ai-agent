[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-musica-ai-agent"
version = "0.1.0"
description = "Deterministic catalog and policy foundation for the Artefact AI Engineer challenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pypdf>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
emporio = "emporio_music.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

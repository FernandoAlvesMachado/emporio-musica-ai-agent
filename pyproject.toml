[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-musica-ai-agent"
version = "0.1.0"
description = "Source-grounded Gemini customer-service agent for the Artefact AI Engineer challenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pypdf>=6.0,<7", "google-genai>=2.34,<3", "python-dotenv>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
emporio = "emporio_music.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
emporio_music = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
